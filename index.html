<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>FIFA 26 Tournament</title>

<style>

:root{
  --bg:#061b14;
  --panel:#0b2b21;
  --panel2:#0e3428;
  --line:#174c3a;
  --text:#e6f4ed;
  --muted:#8caea1;
  --accent:#2cc77c;
  --gold:#d8a934;
  --danger:#d95757;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  background:var(--bg);

  color:var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

header{

  padding:20px;

  border-bottom:
    1px solid var(--line);

  background:#071f18;

  text-align:center;

}

header h1{

  margin:0;

  font-size:25px;

}

header p{

  margin:6px 0 0;

  color:var(--muted);

  font-size:12px;

}

#bracket{

  width:max-content;

  min-width:100%;

  padding:25px;

  display:grid;

  grid-template-columns:
    repeat(5,minmax(240px,1fr));

  gap:28px;

  align-items:start;

}

.stage h2{

  text-align:center;

  color:#45c98a;

  font-size:11px;

  letter-spacing:1.2px;

  margin:
    0 0 10px;

}

.stage-list{

  display:flex;

  flex-direction:column;

}

.match{

  background:var(--panel);

  border:
    1px solid var(--line);

  border-radius:8px;

  padding:10px;

}

.match + .match{

  margin-top:16px;

}

.match .time{

  color:var(--gold);

  font-size:10px;

  font-weight:bold;

  margin-bottom:7px;

}

.match-type{

  color:#45c98a;

  font-size:9px;

  text-transform:uppercase;

  letter-spacing:.7px;

  margin-bottom:6px;

}

.player{

  display:flex;

  align-items:center;

  min-height:28px;

  padding:4px 2px;

  border-bottom:
    1px solid #153f31;

  font-size:12px;

}

.player:last-of-type{

  border-bottom:0;

}

.player .name{

  flex:1;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}

.roll{

  color:#71998b;

  font-size:9px;

  margin-left:4px;

}

.score{

  min-width:32px;

  padding:4px;

  text-align:center;

  font-weight:bold;

  border-radius:4px;

  background:#082119;

}

.player.winner{

  font-weight:bold;

}

.player.winner .score{

  background:#175b40;

}

.player.loser{

  opacity:.55;

}

.empty{

  color:#5d8074;

  font-style:italic;

}

.status{

  margin-top:8px;

  color:var(--muted);

  font-size:9px;

}

.series-box{

  margin-top:9px;

  padding-top:8px;

  border-top:
    1px solid var(--line);

}

.series-score{

  color:var(--accent);

  font-weight:bold;

  font-size:13px;

  margin-bottom:7px;

}

.games{

  display:flex;

  flex-direction:column;

  gap:4px;

}

.game{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:5px 6px;

  background:#071f18;

  border-radius:4px;

  font-size:9px;

  color:var(--muted);

}

.game strong{

  color:#45c98a;

}

.series-winner{

  margin-top:7px;

  font-size:10px;

  color:var(--muted);

}

.series-winner strong{

  color:var(--accent);

}

.stage.prelim .match{

  min-height:105px;

}

.stage.r16 .match{

  margin-top:30px;

}

.stage.qf .match{

  margin-top:104px;

}

.stage.sf .match{

  margin-top:255px;

}

.stage.final .match{

  margin-top:510px;

}

.stage.r16 .match + .match{

  margin-top:30px;

}

.stage.qf .match + .match{

  margin-top:155px;

}

.stage.sf .match + .match{

  margin-top:470px;

}

.stage.final .match + .match{

  margin-top:0;

}

.footer{

  text-align:center;

  color:var(--muted);

  font-size:10px;

  padding:
    20px;

}

@media(max-width:1000px){

  #bracket{

    grid-template-columns:
      repeat(5,250px);

    overflow-x:auto;

  }

}

</style>

</head>

<body>

<header>

  <h1>
    FIFA 26 Tournament
  </h1>

  <p>
    Live Tournament Bracket
  </p>

</header>

<main id="bracket"></main>

<div class="footer">

  Results are updated automatically from the tournament admin panel.

</div>

<script>

/* =========================================================
   PLAYERS
========================================================= */

const PLAYERS = [

  ["Prakul Mishra","MBATM25025"],
  ["Tushar Singh","MBA25181"],
  ["Shubham Kashyap","MBA25140"],
  ["Adhyan Kumar","MBA25231"],
  ["Aryaman Singh","MBA25059"],
  ["Nima","MBA25075"],
  ["Robert Gupta","MBA25083"],
  ["PARIMAL MISHRA","MBA25171"],
  ["Anirban Guha","MBA26008"],
  ["Rieshi Rao","MBA26049"],
  ["Shubh Wadhwa","MBA26120"],
  ["Karanbir Singh Dhoul","MBA26158"],
  ["Abhilash Naskar","MBA26004"],
  ["Siddhant Singh","MBA25180"],
  ["Kush Soni","MBA25119"],
  ["Jay Mishra","MBATm26037"],
  ["Hemant Agrawal","MBA25188"],
  ["Varun Rathi","MBA25230"],
  ["kartikay sharma","mbatm26016"],
  ["Meet Gowsawmi",""],
  ["Chaitanya Wankhande","MBA25062"],
  ["RajVardhan","25003"],
  ["Adhiraj","25053"],
  ["Arush","25005"],
  ["Kabir","MBA25212"]

];

const byName = Object.fromEntries(

  PLAYERS.map(
    p => [
      p[0],
      {
        name:p[0],
        roll:p[1]
      }
    ]
  )

);

/* =========================================================
   STAGES
========================================================= */

const stages = [

  {
    id:"prelim",
    label:"PRELIMINARY"
  },

  {
    id:"r16",
    label:"ROUND OF 16"
  },

  {
    id:"qf",
    label:"QUARTERFINALS"
  },

  {
    id:"sf",
    label:"SEMIFINALS"
  },

  {
    id:"final",
    label:"FINAL"
  }

];

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}

/* =========================================================
   PLAYER
========================================================= */

function displayPlayer(
  name
){

  if(!name){

    return `
      <span class="empty">
        TBD
      </span>
    `;

  }

  const p =
    byName[name];

  return `

    <span class="name">

      ${escapeHtml(
        p?.name || name
      )}

      ${
        p?.roll
        ?
        `
          <span class="roll">
            ${escapeHtml(p.roll)}
          </span>
        `
        :
        ""
      }

    </span>

  `;

}

/* =========================================================
   LOAD
========================================================= */

function loadMatches(){

  const saved =
    localStorage.getItem(
      "fifa26TournamentMatches"
    );

  if(!saved){

    return [];

  }

  try{

    return JSON.parse(
      saved
    );

  }catch(e){

    return [];

  }

}

/* =========================================================
   NORMALIZE OLD BO3 DATA
========================================================= */

function normalizeGame(game){

  if(!game){

    return null;

  }

  if(typeof game === "string"){

    return {

      score1:null,
      score2:null,
      penalty:null,
      winner:game

    };

  }

  return {

    score1:
      game.score1 ??
      null,

    score2:
      game.score2 ??
      null,

    penalty:
      game.penalty ??
      null,

    winner:
      game.winner ??
      null

  };

}

/* =========================================================
   GAME DISPLAY
========================================================= */

function gameDisplay(
  game,
  p1,
  p2
){

  if(!game){

    return null;

  }

  let score =
    `${game.score1}-${game.score2}`;

  if(game.penalty){

    score +=
      ` (${game.penalty} pens)`;

  }

  const winner =
    game.winner;

  return `

    <div class="game">

      <strong>
        ${score}
      </strong>

      <span>
        ${escapeHtml(
          winner || "—"
        )}
      </span>

    </div>

  `;

}

/* =========================================================
   MATCH CARD
========================================================= */

function matchCard(m){

  const finished =
    Boolean(
      m.played &&
      m.winner
    );

  const p1Win =
    finished &&
    m.winner === m.p1;

  const p2Win =
    finished &&
    m.winner === m.p2;

  let score1 =
    m.score1 ??
    "–";

  let score2 =
    m.score2 ??
    "–";

  let seriesHtml =
    "";

  let status =
    "Not played";

  if(m.bestOf3){

    const g1 =
      normalizeGame(
        m.game1
      );

    const g2 =
      normalizeGame(
        m.game2
      );

    const g3 =
      normalizeGame(
        m.game3
      );

    let p1Wins =
      0;

    let p2Wins =
      0;

    [g1,g2,g3]
      .filter(Boolean)
      .forEach(
        g => {

          if(
            g.winner === m.p1
          ){

            p1Wins++;

          }

          if(
            g.winner === m.p2
          ){

            p2Wins++;

          }

        }
      );

    score1 =
      p1Wins;

    score2 =
      p2Wins;

    if(finished){

      status =
        "Series completed";

    }

    seriesHtml = `

      <div class="series-box">

        <div class="series-score">

          Series:
          ${p1Wins}-${p2Wins}

        </div>

        <div class="games">

          ${
            gameDisplay(
              g1,
              m.p1,
              m.p2
            )
            ||
            ""
          }

          ${
            gameDisplay(
              g2,
              m.p1,
              m.p2
            )
            ||
            ""
          }

          ${
            gameDisplay(
              g3,
              m.p1,
              m.p2
            )
            ||
            ""
          }

        </div>

        ${
          finished
          ?
          `
            <div class="series-winner">

              Series winner:
              <strong>
                ${escapeHtml(
                  m.winner
                )}
              </strong>

            </div>
          `
          :
          ""
        }

      </div>

    `;

  }else{

    if(finished){

      status =
        m.penalties
        ?
        `Final • Penalties ${escapeHtml(m.penalties)}`
        :
        "Final";

    }

  }

  const el =
    document.createElement(
      "article"
    );

  el.className =
    "match";

  el.innerHTML = `

    <div class="time">

      ${m.time || "--:--"}

    </div>

    ${
      m.bestOf3
      ?
      `
        <div class="match-type">
          BEST OF 3
        </div>
      `
      :
      ""
    }

    <div
      class="
        player
        ${p1Win ? "winner" : ""}
        ${
          finished && !p1Win
          ? "loser"
          :
          ""
        }
      "
    >

      ${displayPlayer(m.p1)}

      <span class="score">
        ${score1}
      </span>

    </div>

    <div
      class="
        player
        ${p2Win ? "winner" : ""}
        ${
          finished && !p2Win
          ? "loser"
          :
          ""
        }
      "
    >

      ${displayPlayer(m.p2)}

      <span class="score">
        ${score2}
      </span>

    </div>

    ${seriesHtml}

    <div class="status">

      ${status}

    </div>

  `;

  return el;

}

/* =========================================================
   RENDER
========================================================= */

function render(){

  const matches =
    loadMatches();

  const root =
    document.getElementById(
      "bracket"
    );

  root.innerHTML =
    "";

  if(!matches.length){

    root.innerHTML = `

      <div
        style="
          padding:40px;
          color:#8caea1;
        "
      >
        Waiting for tournament data...
      </div>

    `;

    return;

  }

  for(
    const stage of stages
  ){

    const col =
      document.createElement(
        "section"
      );

    col.className =
      "stage " +
      stage.id;

    col.innerHTML = `

      <h2>
        ${stage.label}
      </h2>

      <div class="stage-list"></div>

    `;

    const list =
      col.querySelector(
        ".stage-list"
      );

    matches
      .filter(
        m =>
          m.stage ===
          stage.id
      )
      .forEach(
        m =>
          list.appendChild(
            matchCard(m)
          )
      );

    root.appendChild(
      col
    );

  }

}

/* =========================================================
   LIVE UPDATE
========================================================= */

/*
  storage event:
  updates when admin.html changes
  localStorage in another tab.
*/

window.addEventListener(
  "storage",
  function(e){

    if(
      e.key ===
      "fifa26TournamentMatches"
    ){

      render();

    }

  }
);

/*
  Polling makes the public page
  update even when the browser does
  not fire a storage event in the
  expected way.
*/

let lastData =
  localStorage.getItem(
    "fifa26TournamentMatches"
  );

setInterval(
  function(){

    const current =
      localStorage.getItem(
        "fifa26TournamentMatches"
      );

    if(
      current !== lastData
    ){

      lastData =
        current;

      render();

    }

  },
  1000
);

/* =========================================================
   INITIAL
========================================================= */

render();

</script>

</body>

</html>
