<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIFA 26 Admin</title>

<style>

:root{
  --bg:#061b14;
  --panel:#0b2b21;
  --panel2:#0e3428;
  --line:#174c3a;
  --text:#e6f4ed;
  --muted:#8caea1;
  --accent:#2cc77c;
  --accent2:#d8a934;
  --danger:#d95757;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.topbar{

  background:#071f18;
  border-bottom:1px solid var(--line);

  padding:14px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

}

h1{
  margin:0;
  font-size:18px;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{

  cursor:pointer;
  font:inherit;

}

.btn{

  border:1px solid var(--line);
  background:#0d3328;
  color:var(--text);

  padding:8px 12px;
  border-radius:6px;

}

.btn:hover{
  background:#124332;
}

.btn.primary{
  background:#168957;
  border-color:#20a967;
}

.btn.danger{
  background:#572525;
  border-color:#7d3535;
}

.container{

  max-width:1500px;
  margin:auto;
  padding:18px;

}

.info{

  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;

}

.badge{

  border:1px solid var(--line);
  background:#09251c;

  color:var(--muted);

  padding:6px 9px;
  border-radius:5px;

  font-size:11px;

}

.badge strong{
  color:var(--text);
}

.section{

  background:#09251c;
  border:1px solid var(--line);

  border-radius:8px;

  padding:14px;
  margin-bottom:15px;

}

.section h2{

  margin:0 0 12px;

  font-size:14px;

}

.settings{

  display:grid;

  grid-template-columns:
    repeat(3,minmax(180px,1fr));

  gap:10px;

}

.field label{

  display:block;

  font-size:10px;
  color:var(--muted);

  margin-bottom:5px;

}

.field input,
.field select{

  width:100%;

  background:#061b14;
  color:var(--text);

  border:1px solid var(--line);

  border-radius:5px;

  padding:8px;

}

.bracket-grid{

  display:grid;

  grid-template-columns:
    repeat(3,minmax(250px,1fr));

  gap:10px;

}

.edit-match{

  border:1px solid var(--line);

  background:#071f18;

  border-radius:6px;

  padding:10px;

}

.stage-label{

  font-size:9px;

  color:#45c98a;

  text-transform:uppercase;

  margin-bottom:8px;

}

.edit-match label{

  display:block;

  font-size:9px;

  color:var(--muted);

  margin:5px 0;

}

.edit-match select{

  width:100%;

  background:#061b14;
  color:var(--text);

  border:1px solid var(--line);

  padding:6px;

  border-radius:4px;

}

.result-grid{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(300px,1fr));

  gap:12px;

}

.result-card{

  border:1px solid var(--line);

  background:#071f18;

  border-radius:7px;

  padding:12px;

}

.result-title{

  font-weight:bold;
  font-size:12px;

  margin-bottom:8px;

}

.result-format{

  color:#45c98a;
  font-size:9px;
  margin-bottom:8px;

}

.game{

  border-top:1px solid var(--line);

  padding-top:9px;
  margin-top:9px;

}

.game-title{

  font-size:10px;
  color:var(--accent2);

  margin-bottom:7px;

  font-weight:bold;

}

.score-grid{

  display:grid;

  grid-template-columns:
    1fr 60px 60px;

  gap:6px;

  align-items:center;

}

.score-grid span{

  font-size:10px;

}

.score-grid input{

  width:100%;

  background:#061b14;
  color:white;

  border:1px solid var(--line);

  border-radius:4px;

  padding:6px;

  text-align:center;

}

.penalty-row{

  margin-top:7px;

}

.penalty-row select{

  width:100%;

  background:#061b14;
  color:white;

  border:1px solid var(--line);

  border-radius:4px;

  padding:6px;

}

.result-actions{

  display:flex;

  justify-content:flex-end;

  gap:7px;

  margin-top:10px;

}

.status{

  color:var(--muted);
  font-size:9px;

}

.pool{

  color:var(--muted);

  font-size:10px;

  margin-top:12px;

}

.pool-list{

  display:flex;
  gap:6px;
  flex-wrap:wrap;

  margin-top:7px;

}

.pool-item{

  padding:5px 7px;

  background:#0d3328;

  border:1px solid var(--line);

  border-radius:4px;

}

@media(max-width:900px){

  .settings,
  .bracket-grid,
  .result-grid{

    grid-template-columns:1fr;

  }

  .topbar{

    align-items:flex-start;
    flex-direction:column;

  }

}

</style>

</head>

<body>

<header class="topbar">

  <div>

    <h1>FIFA 26 Tournament — Admin</h1>

    <div class="subtitle">

      Bracket control • Results • Best of 3 semifinals/final

    </div>

  </div>

  <div class="actions">

    <button
      class="btn"
      onclick="location.href='index.html'"
    >
      View Tournament
    </button>

    <button
      class="btn danger"
      id="resetBtn"
    >
      Reset Tournament
    </button>

  </div>

</header>

<div class="container">

  <div class="info">

    <div class="badge">
      Start:
      <strong id="startBadge">20:30</strong>
    </div>

    <div class="badge">
      Normal Match:
      <strong>12 min</strong>
    </div>

    <div class="badge">
      Semifinals:
      <strong>Best of 3</strong>
    </div>

    <div class="badge">
      Final:
      <strong>Best of 3</strong>
    </div>

  </div>


  <!-- SETTINGS -->

  <section class="section">

    <h2>Tournament Timing</h2>

    <div class="settings">

      <div class="field">

        <label>Starting Time</label>

        <input
          type="time"
          id="startTime"
          value="20:30"
        >

      </div>

      <div class="field">

        <label>Minutes Per Half</label>

        <input
          type="number"
          id="halfMinutes"
          min="1"
          max="30"
          value="6"
        >

      </div>

      <div class="field">

        <label>Gap Between Matches</label>

        <input
          type="number"
          id="gapMinutes"
          min="0"
          max="60"
          value="0"
        >

      </div>

    </div>

    <br>

    <button
      class="btn primary"
      id="saveSettings"
    >
      Save Timing
    </button>

  </section>


  <!-- BRACKET EDITOR -->

  <section class="section">

    <h2>Manual Bracket Setup</h2>

    <div
      class="bracket-grid"
      id="bracketGrid"
    ></div>

    <div class="pool">

      Player Pool

      <div
        class="pool-list"
        id="playerPool"
      ></div>

    </div>

    <br>

    <button
      class="btn primary"
      id="saveBracket"
    >
      Save Bracket
    </button>

  </section>


  <!-- RESULTS -->

  <section class="section">

    <h2>Enter / Edit Results</h2>

    <div
      class="result-grid"
      id="resultGrid"
    ></div>

  </section>

</div>


<script>

const PLAYERS=[

  ["Prakul Mishra","MBATM25025"],
  ["Tushar Singh","MBA25181"],
  ["Shubham Kashyap","MBA25140"],
  ["Adhyan Kumar","MBA25231"],
  ["Aryaman Singh","MBA25059"],
  ["Nima","MBA25075"],
  ["Robert Gupta","MBA25083"],
  ["PARIMAL MISHRA","MBA25171"],
  ["Anirban Guha","MBA26008"],
  ["Rieshi Rao","MBA26049"],
  ["Shubh Wadhwa","MBA26120"],
  ["Karanbir Singh Dhoul","MBA26158"],
  ["Abhilash Naskar","MBA26004"],
  ["Siddhant Singh","MBA25180"],
  ["Kush Soni","MBA25119"],
  ["Jay Mishra","MBATm26037"],
  ["Hemant Agrawal","MBA25188"],
  ["Varun Rathi","MBA25230"],
  ["kartikay sharma","mbatm26016"],
  ["Meet Gowsawmi",""],
  ["Chaitanya Wankhande","MBA25062"],
  ["RajVardhan","25003"],
  ["Adhiraj","25053"],
  ["Arush","25005"],
  ["Kabir","MBA25212"]

];

const stages=[
  {id:"prelim",label:"PRELIMINARY"},
  {id:"r16",label:"ROUND OF 16"},
  {id:"qf",label:"QUARTERFINALS"},
  {id:"sf",label:"SEMIFINALS"},
  {id:"final",label:"FINAL"}
];

function makeMatch(
  id,
  stage,
  a=null,
  b=null,
  nextMatch=null,
  nextSlot=null
){

  return {

    id,
    stage,

    p1:a,
    p2:b,

    score1:null,
    score2:null,
    penalties:null,

    winner:null,

    nextMatch,
    nextSlot,

    time:null,
    played:false,

    bye:false,

    bestOf3:
      stage==="sf" ||
      stage==="final",

    games:[

      {
        score1:null,
        score2:null,
        winner:null,
        penalties:null
      },

      {
        score1:null,
        score2:null,
        winner:null,
        penalties:null
      },

      {
        score1:null,
        score2:null,
        winner:null,
        penalties:null
      }

    ]

  };

}

const DEFAULT_MATCHES=[

  makeMatch(
    "p1","prelim",
    "Anirban Guha",
    "Robert Gupta",
    "r1",1
  ),

  makeMatch(
    "p2","prelim",
    "Prakul Mishra",
    "RajVardhan",
    "r2",0
  ),

  makeMatch(
    "p3","prelim",
    "Abhilash Naskar",
    "Adhiraj",
    "r3",0
  ),

  makeMatch(
    "p4","prelim",
    "Karanbir Singh Dhoul",
    "Rieshi Rao",
    "r4",0
  ),

  makeMatch(
    "p5","prelim",
    "Meet Gowsawmi",
    "Adhyan Kumar",
    "r5",0
  ),

  makeMatch(
    "p6","prelim",
    "Chaitanya Wankhande",
    "Shubh Wadhwa",
    "r6",0
  ),

  makeMatch(
    "p7","prelim",
    "Jay Mishra",
    "kartikay sharma",
    "r7",0
  ),

  makeMatch(
    "p8","prelim",
    "Nima",
    "Arush",
    "r1",0
  ),

  makeMatch(
    "p9","prelim",
    "Kush Soni",
    "Kabir",
    "r8",1
  ),

  makeMatch(
    "r1","r16",
    null,
    null,
    "q1",0
  ),

  makeMatch(
    "r2","r16",
    null,
    "PARIMAL MISHRA",
    "q1",1
  ),

  makeMatch(
    "r3","r16",
    null,
    "Siddhant Singh",
    "q2",0
  ),

  makeMatch(
    "r4","r16",
    null,
    "Tushar Singh",
    "q2",1
  ),

  makeMatch(
    "r5","r16",
    null,
    "Aryaman Singh",
    "q3",0
  ),

  makeMatch(
    "r6","r16",
    null,
    "Hemant Agrawal",
    "q3",1
  ),

  makeMatch(
    "r7","r16",
    null,
    "Shubham Kashyap",
    "q4",0
  ),

  makeMatch(
    "r8","r16",
    "Varun Rathi",
    null,
    "q4",1
  ),

  makeMatch(
    "q1","qf",
    null,null,
    "s1",0
  ),

  makeMatch(
    "q2","qf",
    null,null,
    "s1",1
  ),

  makeMatch(
    "q3","qf",
    null,null,
    "s2",0
  ),

  makeMatch(
    "q4","qf",
    null,null,
    "s2",1
  ),

  makeMatch(
    "s1","sf",
    null,null,
    "f1",0
  ),

  makeMatch(
    "s2","sf",
    null,null,
    "f1",1
  ),

  makeMatch(
    "f1","final"
  )

];

function clone(x){
  return JSON.parse(JSON.stringify(x));
}

function loadMatches(){

  const saved=
    localStorage.getItem(
      "fifa26TournamentMatches"
    );

  if(!saved)
    return clone(DEFAULT_MATCHES);

  const data=JSON.parse(saved);

  data.forEach(m=>{

    m.bestOf3=
      m.stage==="sf" ||
      m.stage==="final";

    if(!Array.isArray(m.games)){

      m.games=[
        {
          score1:m.score1,
          score2:m.score2,
          winner:m.winner,
          penalties:m.penalties
        },
        {
          score1:null,
          score2:null,
          winner:null,
          penalties:null
        },
        {
          score1:null,
          score2:null,
          winner:null,
          penalties:null
        }
      ];

    }

  });

  return data;

}

function loadSettings(){

  const saved=
    localStorage.getItem(
      "fifa26TournamentSettings"
    );

  return saved
    ? JSON.parse(saved)
    : {
        startTime:"20:30",
        halfMinutes:6,
        gapMinutes:0
      };

}

let matches=loadMatches();
let settings=loadSettings();

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c])
  );

}

function scheduleMatches(){

  const order=[

    ...matches.filter(
      m=>m.stage==="prelim"
    ),

    ...matches.filter(
      m=>m.stage==="r16"
    ),

    ...matches.filter(
      m=>m.stage==="qf"
    ),

    ...matches.filter(
      m=>m.stage==="sf"
    ),

    ...matches.filter(
      m=>m.stage==="final"
    )

  ];

  const [h,m]=
    settings.startTime
      .split(":")
      .map(Number);

  let cursor=h*60+m;

  for(const match of order){

    match.time=
      String(
        Math.floor(cursor/60)%24
      ).padStart(2,"0")
      +
      ":"
      +
      String(cursor%60)
        .padStart(2,"0");

    cursor +=
      Number(settings.halfMinutes)*2+
      Number(settings.gapMinutes);

  }

}

function resetMatchResult(m){

  m.played=false;

  m.winner=null;

  m.score1=null;
  m.score2=null;
  m.penalties=null;

  m.games=[

    {
      score1:null,
      score2:null,
      winner:null,
      penalties:null
    },

    {
      score1:null,
      score2:null,
      winner:null,
      penalties:null
    },

    {
      score1:null,
      score2:null,
      winner:null,
      penalties:null
    }

  ];

}

function propagateWinner(m){

  if(!m.winner || !m.nextMatch)
    return;

  const next=
    matches.find(
      x=>x.id===m.nextMatch
    );

  if(!next)
    return;

  if(m.nextSlot===0)
    next.p1=m.winner;
  else
    next.p2=m.winner;

}

function calculateSeriesWinner(m){

  let p1Wins=0;
  let p2Wins=0;

  m.games.forEach(g=>{

    if(g.winner===m.p1)
      p1Wins++;

    if(g.winner===m.p2)
      p2Wins++;

  });

  if(p1Wins>=2)
    return m.p1;

  if(p2Wins>=2)
    return m.p2;

  return null;

}

function saveGame(m,index){

  const game=m.games[index];

  const score1=
    Number(
      document.getElementById(
        `g${m.id}_${index}_1`
      ).value
    );

  const score2=
    Number(
      document.getElementById(
        `g${m.id}_${index}_2`
      ).value
    );

  if(score1<0 || score2<0){

    alert("Scores cannot be negative.");
    return;

  }

  let winner=null;
  let penalties=null;

  if(score1>score2){

    winner=m.p1;

  }
  else if(score2>score1){

    winner=m.p2;

  }
  else{

    const penaltySelect=
      document.getElementById(
        `p${m.id}_${index}`
      );

    winner=penaltySelect.value;

    if(!winner){

      alert(
        "The game is a draw. Select the penalty winner."
      );

      return;

    }

    const p1pen=
      prompt(
        `Penalty score for ${m.p1}:`,
        "4"
      );

    const p2pen=
      prompt(
        `Penalty score for ${m.p2}:`,
        "3"
      );

    if(
      p1pen===null ||
      p2pen===null
    )
      return;

    penalties=
      `${p1pen}-${p2pen}`;

  }

  game.score1=score1;
  game.score2=score2;
  game.winner=winner;
  game.penalties=penalties;

  const seriesWinner=
    calculateSeriesWinner(m);

  if(seriesWinner){

    m.winner=seriesWinner;
    m.played=true;

    propagateWinner(m);

  }
  else{

    m.winner=null;
    m.played=false;

  }

  localStorage.setItem(
    "fifa26TournamentMatches",
    JSON.stringify(matches)
  );

  renderResults();

}

function editSingleMatch(m){

  const s1=
    document.getElementById(
      `single_${m.id}_1`
    ).value;

  const s2=
    document.getElementById(
      `single_${m.id}_2`
    ).value;

  const score1=Number(s1);
  const score2=Number(s2);

  if(score1<0 || score2<0){

    alert("Scores cannot be negative.");
    return;

  }

  let winner=null;
  let penalties=null;

  if(score1>score2){

    winner=m.p1;

  }
  else if(score2>score1){

    winner=m.p2;

  }
  else{

    const select=
      document.getElementById(
        `single_penalty_${m.id}`
      );

    winner=select.value;

    if(!winner){

      alert(
        "The match is a draw. Select the penalty winner."
      );

      return;

    }

    const p1pen=
      prompt(
        `Penalty score for ${m.p1}:`,
        "4"
      );

    const p2pen=
      prompt(
        `Penalty score for ${m.p2}:`,
        "3"
      );

    if(
      p1pen===null ||
      p2pen===null
    )
      return;

    penalties=
      `${p1pen}-${p2pen}`;

  }

  m.score1=score1;
  m.score2=score2;
  m.winner=winner;
  m.penalties=penalties;
  m.played=true;

  propagateWinner(m);

  localStorage.setItem(
    "fifa26TournamentMatches",
    JSON.stringify(matches)
  );

  renderResults();

  renderBracketEditor();

}

function renderResults(){

  scheduleMatches();

  const root=
    document.getElementById(
      "resultGrid"
    );

  root.innerHTML="";

  matches.forEach(m=>{

    if(!m.p1 || !m.p2)
      return;

    const card=
      document.createElement("div");

    card.className="result-card";

    if(m.bestOf3){

      let gamesHTML="";

      for(let i=0;i<3;i++){

        const g=m.games[i];

        gamesHTML+=`

          <div class="game">

            <div class="game-title">
              GAME ${i+1}
            </div>

            <div class="score-grid">

              <span>
                ${escapeHtml(m.p1)}
              </span>

              <input
                id="g${m.id}_${i}_1"
                type="number"
                min="0"
                value="${g.score1 ?? ""}"
              >

              <input
                id="g${m.id}_${i}_2"
                type="number"
                min="0"
                value="${g.score2 ?? ""}"
              >

            </div>

            <div class="score-grid">

              <span>
                ${escapeHtml(m.p2)}
              </span>

              <span></span>
              <span></span>

            </div>

            <div class="penalty-row">

              <select
                id="p${m.id}_${i}"
              >

                <option value="">
                  Penalty winner if draw
                </option>

                <option
                  value="${escapeHtml(m.p1)}"
                  ${g.winner===m.p1?"selected":""}
                >
                  ${escapeHtml(m.p1)}
                </option>

                <option
                  value="${escapeHtml(m.p2)}"
                  ${g.winner===m.p2?"selected":""}
                >
                  ${escapeHtml(m.p2)}
                </option>

              </select>

            </div>

            <div class="result-actions">

              <button
                class="btn primary"
                onclick="saveGame(
                  matches.find(x=>x.id==='${m.id}'),
                  ${i}
                )"
              >
                Save Game ${i+1}
              </button>

            </div>

          </div>

        `;

      }

      card.innerHTML=`

        <div class="result-title">
          ${escapeHtml(m.p1)}
          vs
          ${escapeHtml(m.p2)}
        </div>

        <div class="result-format">
          BEST OF 3
        </div>

        ${gamesHTML}

        <div class="status">
          ${
            m.winner
            ?
            `Series Winner: ${escapeHtml(m.winner)}`
            :
            "Series not completed"
          }
        </div>

      `;

    }
    else{

      card.innerHTML=`

        <div class="result-title">

          ${escapeHtml(m.p1)}
          vs
          ${escapeHtml(m.p2)}

        </div>

        <div class="result-format">
          SINGLE MATCH
        </div>

        <div class="score-grid">

          <span>
            ${escapeHtml(m.p1)}
          </span>

          <input
            id="single_${m.id}_1"
            type="number"
            min="0"
            value="${m.score1 ?? ""}"
          >

          <input
            id="single_${m.id}_2"
            type="number"
            min="0"
            value="${m.score2 ?? ""}"
          >

        </div>

        <div class="penalty-row">

          <select
            id="single_penalty_${m.id}"
          >

            <option value="">
              Penalty winner if draw
            </option>

            <option
              value="${escapeHtml(m.p1)}"
              ${m.winner===m.p1?"selected":""}
            >
              ${escapeHtml(m.p1)}
            </option>

            <option
              value="${escapeHtml(m.p2)}"
              ${m.winner===m.p2?"selected":""}
            >
              ${escapeHtml(m.p2)}
            </option>

          </select>

        </div>

        <div class="result-actions">

          <button
            class="btn primary"
            onclick="editSingleMatch(
              matches.find(x=>x.id==='${m.id}')
            )"
          >
            Save Result
          </button>

        </div>

        <div class="status">

          ${
            m.winner
            ?
            `Winner: ${escapeHtml(m.winner)}`
            :
            "Not played"
          }

        </div>

      `;

    }

    root.appendChild(card);

  });

}

function renderBracketEditor(){

  const root=
    document.getElementById(
      "bracketGrid"
    );

  root.innerHTML="";

  matches.forEach(m=>{

    const box=
      document.createElement("div");

    box.className="edit-match";

    box.innerHTML=`

      <div class="stage-label">
        ${m.stage} · ${m.id}
      </div>

      <label>Player 1</label>

      <select
        data-mid="${m.id}"
        data-slot="p1"
      ></select>

      <label>Player 2</label>

      <select
        data-mid="${m.id}"
        data-slot="p2"
      ></select>

    `;

    root.appendChild(box);

    for(
      const slot of ["p1","p2"]
    ){

      const select=
        box.querySelector(
          `[data-slot="${slot}"]`
        );

      select.innerHTML=
        `<option value="">
          TBD / Empty
        </option>`
        +
        PLAYERS.map(
          p=>
          `<option
            value="${escapeHtml(p[0])}"
          >
            ${escapeHtml(p[0])}
            ${p[1]
              ? " — "+escapeHtml(p[1])
              : ""}
          </option>`
        ).join("");

      select.value=
        m[slot] || "";

    }

  });

  document.getElementById(
    "playerPool"
  ).innerHTML=
    PLAYERS.map(
      p=>
      `<span class="pool-item">
        ${escapeHtml(p[0])}
        ${p[1]
          ? " · "+escapeHtml(p[1])
          : ""}
      </span>`
    ).join("");

}

function saveBracket(){

  document
    .querySelectorAll(
      "#bracketGrid select"
    )
    .forEach(select=>{

      const mid=
        select.dataset.mid;

      const slot=
        select.dataset.slot;

      const match=
        matches.find(
          m=>m.id===mid
        );

      if(match){

        const old=
          match[slot];

        match[slot]=
          select.value || null;

        if(old!==match[slot]){

          resetMatchResult(match);

        }

      }

    });

  scheduleMatches();

  localStorage.setItem(
    "fifa26TournamentMatches",
    JSON.stringify(matches)
  );

  renderBracketEditor();
  renderResults();

  alert("Bracket saved.");

}

document.getElementById(
  "saveSettings"
).onclick=()=>{

  settings.startTime=
    document.getElementById(
      "startTime"
    ).value || "20:30";

  settings.halfMinutes=
    Math.max(
      1,
      Number(
        document.getElementById(
          "halfMinutes"
        ).value
      ) || 6
    );

  settings.gapMinutes=
    Math.max(
      0,
      Number(
        document.getElementById(
          "gapMinutes"
        ).value
      ) || 0
    );

  scheduleMatches();

  localStorage.setItem(
    "fifa26TournamentSettings",
    JSON.stringify(settings)
  );

  document.getElementById(
    "startBadge"
  ).textContent=
    settings.startTime;

  alert("Timing saved.");

};

document.getElementById(
  "resetBtn"
).onclick=()=>{

  if(
    !confirm(
      "Reset the entire tournament? This will remove all scores, winners and bracket changes."
    )
  )
    return;

  matches=
    clone(DEFAULT_MATCHES);

  settings={
    startTime:"20:30",
    halfMinutes:6,
    gapMinutes:0
  };

  localStorage.setItem(
    "fifa26TournamentMatches",
    JSON.stringify(matches)
  );

  localStorage.setItem(
    "fifa26TournamentSettings",
    JSON.stringify(settings)
  );

  document.getElementById(
    "startTime"
  ).value="20:30";

  document.getElementById(
    "halfMinutes"
  ).value=6;

  document.getElementById(
    "gapMinutes"
  ).value=0;

  renderBracketEditor();
  renderResults();

};

document.getElementById(
  "saveBracket"
).onclick=saveBracket;

document.getElementById(
  "startTime"
).value=settings.startTime;

document.getElementById(
  "halfMinutes"
).value=settings.halfMinutes;

document.getElementById(
  "gapMinutes"
).value=settings.gapMinutes;

document.getElementById(
  "startBadge"
).textContent=
  settings.startTime;

renderBracketEditor();
renderResults();

</script>

</body>
</html>
