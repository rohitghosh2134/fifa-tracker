<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIFA 26 Tournament Admin</title>

<style>

:root{
  --bg:#061b14;
  --panel:#0b2b21;
  --panel2:#0e3428;
  --line:#174c3a;
  --text:#e6f4ed;
  --muted:#8caea1;
  --accent:#2cc77c;
  --accent2:#d8a934;
  --danger:#d95757;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.topbar{
  background:#071f18;
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  margin:0;
  font-size:18px;
}

.subtitle{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  cursor:pointer;
}

.btn{
  border:1px solid var(--line);
  background:#0d3328;
  color:var(--text);
  padding:8px 12px;
  border-radius:6px;
}

.btn.primary{
  background:#168957;
  border-color:#20a967;
}

.btn.danger{
  background:#572525;
  border-color:#7d3535;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:18px;
}

.settings{
  background:#09251c;
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px;
  margin-bottom:15px;
}

.settings h2{
  margin:0 0 12px;
  font-size:13px;
}

.settings-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(150px,1fr));
  gap:10px;
}

label{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

input,
select{
  width:100%;
  background:#061b14;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:5px;
  padding:8px;
}

.section-title{
  margin:20px 0 10px;
  color:#45c98a;
  font-size:13px;
  letter-spacing:1px;
}

.match-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(250px,1fr));
  gap:12px;
}

.match{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px;
}

.match-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.match-id{
  color:#45c98a;
  font-size:10px;
  text-transform:uppercase;
}

.match-time{
  color:var(--accent2);
  font-size:10px;
  font-weight:bold;
}

.players{
  margin-bottom:10px;
}

.player-name{
  padding:7px;
  background:#071f18;
  border:1px solid #153f31;
  margin-bottom:5px;
  border-radius:4px;
  font-size:11px;
}

.result-area{
  border-top:1px solid var(--line);
  padding-top:10px;
}

.single-result{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.bo3{
  border-top:1px solid var(--line);
  padding-top:8px;
}

.bo3-title{
  color:#45c98a;
  font-size:10px;
  font-weight:bold;
  margin-bottom:8px;
}

.game{
  background:#071f18;
  border:1px solid #153f31;
  border-radius:5px;
  padding:8px;
  margin-bottom:7px;
}

.game-label{
  color:var(--muted);
  font-size:9px;
  margin-bottom:6px;
}

.game-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.game-grid input{
  text-align:center;
}

.status{
  margin-top:8px;
  color:var(--muted);
  font-size:9px;
}

.save-row{
  display:flex;
  justify-content:flex-end;
  margin-top:9px;
}

.pool{
  margin-top:20px;
  background:#09251c;
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px;
}

.pool-title{
  font-size:11px;
  color:#45c98a;
  margin-bottom:8px;
}

.pool-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.pool-item{
  padding:5px 7px;
  border:1px solid var(--line);
  background:#0d3328;
  border-radius:4px;
  font-size:9px;
  color:var(--muted);
}

@media(max-width:1000px){

  .match-grid{
    grid-template-columns:1fr;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header class="topbar">

  <div>

    <h1>FIFA 26 Tournament — Admin</h1>

    <div class="subtitle">
      Results, bracket progression and tournament timing
    </div>

  </div>

  <div class="actions">

    <button
      class="btn"
      onclick="location.href='index.html'"
    >
      Public Bracket
    </button>

    <button
      class="btn danger"
      id="resetBtn"
    >
      Reset Tournament
    </button>

  </div>

</header>


<div class="container">


  <!-- SETTINGS -->

  <section class="settings">

    <h2>Tournament Settings</h2>

    <div class="settings-grid">

      <div>

        <label>
          Starting Time
        </label>

        <input
          id="startTime"
          type="time"
          value="07:30"
        >

      </div>


      <div>

        <label>
          Minutes Per Half
        </label>

        <input
          id="halfMinutes"
          type="number"
          min="1"
          max="30"
          value="6"
        >

      </div>


      <div>

        <label>
          Gap Between Matches
        </label>

        <input
          id="gapMinutes"
          type="number"
          min="0"
          max="60"
          value="0"
        >

      </div>

    </div>


    <div class="save-row">

      <button
        class="btn primary"
        id="saveSettings"
      >
        Save Timing
      </button>

    </div>

  </section>


  <!-- MATCHES -->

  <div id="matchesContainer"></div>


  <!-- PLAYER POOL -->

  <section class="pool">

    <div class="pool-title">
      Player Pool
    </div>

    <div
      class="pool-list"
      id="playerPool"
    ></div>

  </section>

</div>


<script>

/* =========================================================
   PLAYERS
========================================================= */

const PLAYERS = [

  ["Prakul Mishra","MBATM25025"],
  ["Tushar Singh","MBA25181"],
  ["Shubham Kashyap","MBA25140"],
  ["Adhyan Kumar","MBA25231"],
  ["Aryaman Singh","MBA25059"],
  ["Nima","MBA25075"],
  ["Robert Gupta","MBA25083"],
  ["PARIMAL MISHRA","MBA25171"],
  ["Anirban Guha","MBA26008"],
  ["Rieshi Rao","MBA26049"],
  ["Shubh Wadhwa","MBA26120"],
  ["Karanbir Singh Dhoul","MBA26158"],
  ["Abhilash Naskar","MBA26004"],
  ["Siddhant Singh","MBA25180"],
  ["Kush Soni","MBA25119"],
  ["Jay Mishra","MBATm26037"],
  ["Hemant Agrawal","MBA25188"],
  ["Varun Rathi","MBA25230"],
  ["kartikay sharma","mbatm26016"],
  ["Meet Gowsawmi",""],
  ["Chaitanya Wankhande","MBA25062"],
  ["RajVardhan","25003"],
  ["Adhiraj","25053"],
  ["Arush","25005"],
  ["Kabir","MBA25212"]

const byName = Object.fromEntries(
  PLAYERS.map(p => [
    p[0],
    {
      name:p[0],
      roll:p[1]
    }
  ])
);


/* =========================================================
   MATCHES
========================================================= */

function makeMatch(
  id,
  stage,
  a=null,
  b=null,
  nextMatch=null,
  nextSlot=null,
  bye=false
){

  return {

    id,
    stage,

    p1:a,
    p2:b,

    score1:null,
    score2:null,

    games:[
      {p1:null,p2:null},
      {p1:null,p2:null},
      {p1:null,p2:null}
    ],

    penalties:null,

    winner:null,

    nextMatch,
    nextSlot,

    bye,

    time:null,

    played:false

  };

}


const DEFAULT_MATCHES = [

  makeMatch(
    "p1",
    "prelim",
    "Anirban Guha",
    "Robert Gupta",
    "r1",
    0
  ),

  makeMatch(
    "p2",
    "prelim",
    "Prakul Mishra",
    "RajVardhan",
    "r2",
    0
  ),

  makeMatch(
    "p3",
    "prelim",
    "Abhilash Naskar",
    "Adhiraj",
    "r3",
    0
  ),

  makeMatch(
    "p4",
    "prelim",
    "Karanbir Singh Dhoul",
    "Rieshi Rao",
    "r4",
    0
  ),

  makeMatch(
    "p5",
    "prelim",
    "Meet Gowsawmi",
    "Adhyan Kumar",
    "r5",
    0
  ),

  makeMatch(
    "p6",
    "prelim",
    "Chaitanya Wankhande",
    "Shubh Wadhwa",
    "r6",
    0
  ),

  makeMatch(
    "p7",
    "prelim",
    "Jay Mishra",
    "kartikay sharma",
    "r7",
    0
  ),

  makeMatch(
    "p8",
    "prelim",
    "Nima",
    "Arush"
  ),

  makeMatch(
    "p9",
    "prelim",
    "Kush Soni",
    "Kabir",
    "r8",
    1
  ),


  /* R16 */

  makeMatch(
    "r1",
    "r16",
    null,
    null,
    "q1",
    0
  ),

  makeMatch(
    "r2",
    "r16",
    null,
    "PARIMAL MISHRA",
    "q1",
    1
  ),

  makeMatch(
    "r3",
    "r16",
    null,
    "Siddhant Singh",
    "q2",
    0
  ),

  makeMatch(
    "r4",
    "r16",
    null,
    "Tushar Singh",
    "q2",
    1
  ),

  makeMatch(
    "r5",
    "r16",
    null,
    "Aryaman Singh",
    "q3",
    0
  ),

  makeMatch(
    "r6",
    "r16",
    null,
    "Hemant Agrawal",
    "q3",
    1
  ),

  makeMatch(
    "r7",
    "r16",
    null,
    "Shubham Kashyap",
    "q4",
    0
  ),

  makeMatch(
    "r8",

  /* QF */

  makeMatch(
    "q1",

    null,

    "s1",

  ),

  makeMatch(
    "q2",
    "qf",
    null,
    null,
    "s1",
    1
  ),

  makeMatch(
    "q3",
    "qf",
    null,
    null,
    "s2",
    0
  ),

  makeMatch(
    "q4",
    "qf",
    null,
    null,
    "s2",
    1
  ),


  /* SEMIFINALS */

  makeMatch(
    "s1",
    "sf",
    null,
    null,
    "f1",
    0
  ),

  makeMatch(
    "s2",
    "sf",
    null,
    null,
    "f1",
    1
  ),


  /* FINAL */

  makeMatch(
    "f1",
    "final"
  )

];


/* =========================================================
   STATE
========================================================= */

function clone(x){

  return JSON.parse(
    JSON.stringify(x)
  );

}


function loadState(){

  const saved =
    localStorage.getItem(
      "fifa26TournamentMatches"
    );

  return saved
    ? JSON.parse(saved)
    : clone(DEFAULT_MATCHES);

}


function loadSettings(){

  const saved =
    localStorage.getItem(
      "fifa26TournamentSettings"
    );

  return saved
    ? JSON.parse(saved)
    : {
        startTime:"07:30",
        halfMinutes:6,
        gapMinutes:0
      };

}


let matches = loadState();

let settings = loadSettings();


function normalizeState(){

  for(const m of matches){

    if(!Array.isArray(m.games)){

      m.games = [
        {p1:null,p2:null},
        {p1:null,p2:null},
        {p1:null,p2:null}
      ];

    }

    while(m.games.length < 3){

      m.games.push({
        p1:null,
        p2:null
      });

    }

  }

}


function saveState(){

  localStorage.setItem(
    "fifa26TournamentMatches",
    JSON.stringify(matches)
  );

  localStorage.setItem(
    "fifa26TournamentSettings",
    JSON.stringify(settings)
  );

}


/* =========================================================
   HELPERS
========================================================= */

function isBestOf3(m){

  return (
    m.stage === "sf" ||
    m.stage === "final"
  );

}


function calculateBO3Winner(m){

  let p1Wins = 0;
  let p2Wins = 0;


  const games =
    m.games || [];


  for(const game of games){

    if(
      game.p1 === null ||
      game.p2 === null
    ){

      continue;

    }


    const a =
      Number(game.p1);

    const b =
      Number(game.p2);


    if(a > b){

      p1Wins++;

    }
    else if(b > a){

      p2Wins++;

    }

  }


  if(p1Wins >= 2){

    return m.p1;

  }


  if(p2Wins >= 2){

    return m.p2;

  }


  return null;

}


function propagateWinner(m){

  if(
    !m.winner ||
    !m.nextMatch
  ){

    return;

  }


  const next =
    matches.find(
      x =>
        x.id === m.nextMatch
    );


  if(!next){

    return;

  }


  if(m.nextSlot === 0){

    next.p1 =
      m.winner;

  }
  else{

    next.p2 =
      m.winner;

  }

}


/* =========================================================
   SCHEDULE
========================================================= */

function minutesFromTime(t){

  const [h,m] =
    t.split(":").map(Number);

  return h * 60 + m;

}


function timeString(total){

  total =
    (total + 1440) % 1440;

  const h =
    Math.floor(total / 60);

  const m =
    total % 60;

  return (
    String(h).padStart(2,"0")
    +
    ":"
    +
    String(m).padStart(2,"0")
  );

}


function scheduleMatches(){

  const prelim =
    matches.filter(
      m =>
        m.stage === "prelim"
    );


  const both26 = m => {

    const a =
      byName[m.p1]?.roll || "";

    const b =
      byName[m.p2]?.roll || "";

    return (
      a.includes("26") &&
      b.includes("26")
    );

  };


  const only25 = m => {

    const a =
      byName[m.p1]?.roll || "";

    const b =
      byName[m.p2]?.roll || "";

    return (
      a &&
      b &&
      !a.includes("26") &&
      !b.includes("26")
    );

  };


  const order = [

    ...prelim.filter(both26),

    ...prelim.filter(
      m =>
        !both26(m) &&
        !only25(m)
    ),

    ...prelim.filter(only25),

    ...matches.filter(
      m =>
        m.stage === "r16"
    ),

    ...matches.filter(
      m =>
        m.stage === "qf"
    ),

    ...matches.filter(
      m =>
        m.stage === "sf"
    ),

    ...matches.filter(
      m =>
        m.stage === "final"
    )

  ];


  let cursor =
    minutesFromTime(
      settings.startTime
    );


  const minAfter745 = 466;


  for(const m of order){

    if(
      only25(m) &&
      cursor < minAfter745
    ){

      cursor =
        minAfter745;

    }


    m.time =
      timeString(cursor);


    cursor +=
      Number(settings.halfMinutes) * 2
      +
      Number(settings.gapMinutes);

  }

}


/* =========================================================
   RESULT EDITOR
========================================================= */

function renderSingleResult(m){

  return `

    <div class="single-result">

      <div>

        <label>
          ${escapeHtml(m.p1 || "TBD")} Score
        </label>

        <input
          type="number"
          min="0"
          id="score1-${m.id}"
          value="${m.score1 ?? ""}"
        >

      </div>


      <div>

        <label>
          ${escapeHtml(m.p2 || "TBD")} Score
        </label>

        <input
          type="number"
          min="0"
          id="score2-${m.id}"
          value="${m.score2 ?? ""}"
        >

      </div>

    </div>

  `;

}


function renderBO3Result(m){

  const games =
    m.games || [
      {p1:null,p2:null},
      {p1:null,p2:null},
      {p1:null,p2:null}
    ];


  let html = `

    <div class="bo3">

      <div class="bo3-title">
        BEST OF 3 — SEMIFINAL / FINAL
      </div>

  `;


  for(let i=0;i<3;i++){

    html += `

      <div class="game">

        <div class="game-label">
          Game ${i+1}
        </div>

        <div class="game-grid">

          <input
            type="number"
            min="0"
            id="game-${m.id}-${i}-p1"
            placeholder="${escapeHtml(m.p1 || "TBD")}"
            value="${games[i].p1 ?? ""}"
          >

          <input
            type="number"
            min="0"
            id="game-${m.id}-${i}-p2"
            placeholder="${escapeHtml(m.p2 || "TBD")}"
            value="${games[i].p2 ?? ""}"
          >

        </div>

      </div>

    `;

  }


  html += `

      <div class="status">
        Winner is automatically decided after one player
        wins 2 games.
      </div>

    </div>

  `;


  return html;

}


/* =========================================================
   SAVE SINGLE RESULT
========================================================= */

function saveSingleResult(id){

  const m =
    matches.find(
      x => x.id === id
    );


  if(!m) return;


  if(
    !m.p1 ||
    !m.p2
  ){

    alert(
      "This match is not ready yet."
    );

    return;

  }


  const s1 =
    Number(
      document.getElementById(
        `score1-${id}`
      ).value
    );


  const s2 =
    Number(
      document.getElementById(
        `score2-${id}`
      ).value
    );


  if(
    isNaN(s1) ||
    isNaN(s2) ||
    s1 < 0 ||
    s2 < 0
  ){

    alert(
      "Enter valid scores."
    );

    return;

  }


  m.score1 = s1;
  m.score2 = s2;


  m.winner = null;
  m.penalties = null;


  if(s1 > s2){

    m.winner =
      m.p1;

  }
  else if(s2 > s1){

    m.winner =
      m.p2;

  }
  else{

    const penalty1 =
      prompt(
        `Penalty score for ${m.p1}:`,
        "4"
      );


    if(penalty1 === null)
      return;


    const penalty2 =
      prompt(
        `Penalty score for ${m.p2}:`,
        "3"
      );


    if(penalty2 === null)
      return;


    const p1 =
      Number(penalty1);

    const p2 =
      Number(penalty2);


    if(
      isNaN(p1) ||
      isNaN(p2) ||
      p1 === p2
    ){

      alert(
        "Penalty scores must be valid and cannot be equal."
      );

      return;

    }


    m.penalties =
      `${p1}-${p2}`;


    m.winner =
      p1 > p2
      ? m.p1
      : m.p2;

  }


  m.played = true;


  propagateWinner(m);


  saveState();

  renderAdmin();

}


/* =========================================================
   SAVE BEST OF 3
========================================================= */

function saveBO3Result(id){

  const m =
    matches.find(
      x => x.id === id
    );


  if(!m) return;


  if(
    !m.p1 ||
    !m.p2
  ){

    alert(
      "This match is not ready yet."
    );

    return;

  }


  const games = [];


  for(let i=0;i<3;i++){

    const v1 =
      document.getElementById(
        `game-${id}-${i}-p1`
      ).value;


    const v2 =
      document.getElementById(
        `game-${id}-${i}-p2`
      ).value;


    games.push({

      p1:
        v1 === ""
        ? null
        : Number(v1),

      p2:
        v2 === ""
        ? null
        : Number(v2)

    });

  }


  m.games =
    games;


  const winner =
    calculateBO3Winner(m);


  if(!winner){

    m.winner = null;
    m.played = false;

    /*
      If the series is incomplete, do NOT propagate
      anything. The next match remains TBD.
    */

  }
  else{

    m.winner =
      winner;

    m.played =
      true;

    propagateWinner(m);

  }


  saveState();

  renderAdmin();

}


/* =========================================================
   CLEAR RESULT
========================================================= */

function clearResult(id){

  const m =
    matches.find(
      x => x.id === id
    );


  if(!m) return;


  if(
    !confirm(
      "Clear this match result?"
    )
  ){

    return;

  }


  m.score1 = null;
  m.score2 = null;

  m.games = [
    {p1:null,p2:null},
    {p1:null,p2:null},
    {p1:null,p2:null}
  ];

  m.penalties = null;
  m.winner = null;
  m.played = false;


  /*
    Remove this winner from the next match if it
    came from this match.
  */

  if(m.nextMatch){

    const next =
      matches.find(
        x =>
          x.id ===
          m.nextMatch
      );


    if(next){

      if(m.nextSlot === 0){

        next.p1 = null;

      }
      else{

        next.p2 = null;

      }

      clearDownstream(next);

    }

  }


  saveState();

  renderAdmin();

}


function clearDownstream(m){

  m.score1 = null;
  m.score2 = null;

  m.games = [
    {p1:null,p2:null},
    {p1:null,p2:null},
    {p1:null,p2:null}
  ];

  m.penalties = null;
  m.winner = null;
  m.played = false;


  if(m.nextMatch){

    const next =
      matches.find(
        x =>
          x.id ===
          m.nextMatch
      );


    if(next){

      if(m.nextSlot === 0){

        next.p1 = null;

      }
      else{

        next.p2 = null;

      }

      clearDownstream(next);

    }

  }

}


/* =========================================================
   ADMIN RENDER
========================================================= */

const STAGES = [

  ["prelim","PRELIMINARY"],
  ["r16","ROUND OF 16"],
  ["qf","QUARTERFINALS"],
  ["sf","SEMIFINALS"],
  ["final","FINAL"]

];


function renderAdmin(){

  normalizeState();

  scheduleMatches();


  document.getElementById(
    "startTime"
  ).value =
    settings.startTime;


  document.getElementById(
    "halfMinutes"
  ).value =
    settings.halfMinutes;


  document.getElementById(
    "gapMinutes"
  ).value =
    settings.gapMinutes;


  const container =
    document.getElementById(
      "matchesContainer"
    );


  container.innerHTML = "";


  for(const [stageId,label] of STAGES){

    const section =
      document.createElement(
        "section"
      );


    section.innerHTML = `

      <div class="section-title">
        ${label}
      </div>

      <div class="match-grid"></div>

    `;


    const grid =
      section.querySelector(
        ".match-grid"
      );


    matches
      .filter(
        m =>
          m.stage === stageId
      )
      .forEach(
        m =>
          grid.appendChild(
            adminMatchCard(m)
          )
      );


    container.appendChild(
      section
    );

  }


  renderPool();

}


function adminMatchCard(m){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "match";


  let resultArea = "";


  if(
    m.p1 &&
    m.p2
  ){

    if(isBestOf3(m)){

      resultArea =
        renderBO3Result(m);

    }
    else{

      resultArea =
        renderSingleResult(m);

    }

  }
  else{

    resultArea = `

      <div class="status">
        This match is not ready yet.
        Missing players remain TBD.
      </div>

    `;

  }


  card.innerHTML = `

    <div class="match-header">

      <div class="match-id">
        ${m.stage} · ${m.id}
      </div>

      <div class="match-time">
        ${m.time || "--:--"}
      </div>

    </div>


    <div class="players">

      <div class="player-name">
        ${escapeHtml(m.p1 || "TBD")}
      </div>

      <div class="player-name">
        ${escapeHtml(m.p2 || "TBD")}
      </div>

    </div>


    <div class="result-area">

      ${resultArea}

    </div>

  `;


  if(
    m.p1 &&
    m.p2
  ){

    const save =
      document.createElement(
        "button"
      );


    save.className =
      "btn primary";


    save.textContent =
      m.played
      ? "Update Result"
      : "Save Result";


    save.style.marginRight =
      "6px";


    save.onclick = () => {

      if(isBestOf3(m)){

        saveBO3Result(m.id);

      }
      else{

        saveSingleResult(m.id);

      }

    };


    const clear =
      document.createElement(
        "button"
      );


    clear.className =
      "btn danger";


    clear.textContent =
      "Clear";


    clear.onclick = () =>
      clearResult(m.id);


    const row =
      document.createElement(
        "div"
      );


    row.className =
      "save-row";


    row.appendChild(save);
    row.appendChild(clear);


    card.appendChild(row);

  }


  return card;

}


/* =========================================================
   PLAYER POOL
========================================================= */

function renderPool(){

  const pool =
    document.getElementById(
      "playerPool"
    );


  pool.innerHTML =
    PLAYERS.map(
      p => `

        <span class="pool-item">

          ${escapeHtml(p[0])}

          ${
            p[1]
            ?
            " · " +
            escapeHtml(p[1])
            :
            ""
          }

        </span>

      `
    ).join("");

}


/* =========================================================
   SETTINGS
========================================================= */

document.getElementById(
  "saveSettings"
).onclick = () => {

  settings.startTime =
    document.getElementById(
      "startTime"
    ).value ||
    "07:30";


  settings.halfMinutes =
    Math.max(
      1,
      Number(
        document.getElementById(
          "halfMinutes"
        ).value
      ) || 6
    );


  settings.gapMinutes =
    Math.max(
      0,
      Number(
        document.getElementById(
          "gapMinutes"
        ).value
      ) || 0
    );


  scheduleMatches();

  saveState();

  renderAdmin();

};


/* =========================================================
   RESET
========================================================= */

document.getElementById(
  "resetBtn"
).onclick = () => {

  if(
    !confirm(
      "Reset the entire tournament? All results and progression will be cleared."
    )
  ){

    return;

  }


  matches =
    clone(DEFAULT_MATCHES);


  settings = {

    startTime:"07:30",
    halfMinutes:6,
    gapMinutes:0

  };


  saveState();

  renderAdmin();

};


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c])
  );

}


/* =========================================================
   INIT
========================================================= */

normalizeState();

renderAdmin();


/*
   Refresh when index/admin are open in different tabs
   on the SAME DEVICE.
*/

setInterval(() => {

  const latest =
    localStorage.getItem(
      "fifa26TournamentMatches"
    );


  if(!latest) return;


  try{

    const parsed =
      JSON.parse(latest);


    if(
      JSON.stringify(parsed)
      !==
      JSON.stringify(matches)
    ){

      matches =
        parsed;

      renderAdmin();

    }

  }
  catch(e){}

},1000);


window.addEventListener(
  "storage",
  event => {

    if(
      event.key ===
      "fifa26TournamentMatches"
    ){

      if(event.newValue){

        try{

          matches =
            JSON.parse(
              event.newValue
            );

          renderAdmin();

        }
        catch(e){}

      }

    }


    if(
      event.key ===
      "fifa26TournamentSettings"
    ){

      if(event.newValue){

        try{

          settings =
            JSON.parse(
              event.newValue
            );

          renderAdmin();

        }
        catch(e){}

      }

    }

  }
);

</script>
